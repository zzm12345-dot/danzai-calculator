<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蛋仔派对充值折扣计算器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      min-height: 100vh;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sidebar-item {
      padding: 15px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid transparent;
    }

    .sidebar-item:hover {
      background: #34495e;
      border-left-color: #3498db;
    }

    .sidebar-item.active {
      background: #34495e;
      border-left-color: #3498db;
      color: #3498db;
    }

    .content {
      flex: 1;
      background: white;
      padding: 30px;
      overflow-y: auto;
    }

    h1 {
      text-align: left;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
      padding-bottom: 15px;
      border-bottom: 2px solid #ecf0f1;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .radio-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 2px solid #f0f0f0;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .radio-option:hover {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.05);
    }

    .radio-option input[type="radio"] {
      margin-right: 8px;
      accent-color: #667eea;
      width: 16px;
      height: 16px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .btn:hover {
      background: #2980b9;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.3);
    }

    .results {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .results.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    .result-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .result-label {
      color: #555;
      font-size: 14px;
      font-weight: 600;
    }

    .result-value {
      color: #2c3e50;
      font-size: 18px;
      font-weight: 700;
    }

    .profit-positive {
      color: #27ae60 !important;
    }

    .profit-negative {
      color: #e74c3c !important;
    }

    .profit-zero {
      color: #7f8c8d !important;
    }

    .section-divider {
      margin: 35px 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
      border: none;
    }

    .section-title {
      color: #667eea;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        padding: 10px 0;
        border-right: none;
        border-bottom: 1px solid #34495e;
      }

      .sidebar-item {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 12px;
        border-left: none;
        border-bottom: 3px solid transparent;
      }

      .sidebar-item:hover {
        border-left: none;
        border-bottom-color: #3498db;
      }

      .sidebar-item.active {
        border-left: none;
        border-bottom-color: #3498db;
      }

      .content {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .radio-group {
        flex-direction: column;
        gap: 10px;
      }

      .radio-option {
        justify-content: flex-start;
        padding: 8px 12px;
      }

      .result-value {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }

      .sidebar {
        padding: 8px 0;
      }

      .sidebar-item {
        font-size: 12px;
        padding: 10px 8px;
      }

      .content {
        padding: 15px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 20px;
      }

      input[type="number"],
      input[type="text"] {
        padding: 10px 12px;
        font-size: 15px;
      }

      .btn {
        padding: 12px;
        font-size: 15px;
      }

      .results {
        padding: 15px;
      }

      .result-item {
        margin-bottom: 12px;
        padding-bottom: 12px;
      }

      .result-value {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-item active" onclick="showTab('calculator')">
        🥚 充值计算器
      </div>
      <div class="sidebar-item" onclick="showTab('coupon')">
        🎫 优惠券分析
      </div>
    </div>

    <div class="content">
      <div id="calculator-tab">
        <h1>🥚 蛋仔派对充值计算器</h1>

        <div class="form-group">
          <label>选择日期类型</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="rebate" name="dayType" value="rebate" checked>
              <label for="rebate">返利日</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="normal" name="dayType" value="normal">
              <label for="normal">非返利日</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="rechargeAmount">充值金额（元）</label>
          <input type="number" id="rechargeAmount" placeholder="例如：328" step="0.01">
        </div>

        <div class="form-group">
          <label for="actualPayment">实际付款金额（元）</label>
          <input type="number" id="actualPayment" placeholder="例如：246" step="0.01">
        </div>

        <button class="btn" onclick="calculate()">计算</button>

        <div class="form-group" style="margin-top: 20px;">
          <label for="eggRate">蛋币兑换比例（元/蛋币）</label>
          <input type="number" id="eggRate" placeholder="例如：0.065" step="0.001">
        </div>

        <div class="form-group">
          <label for="couponRate">无门槛优惠券兑换比例（元/优惠券）</label>
          <input type="number" id="couponRate" placeholder="例如：0.7" step="0.01">
        </div>

        <button class="btn" onclick="calculateProfit()">计算利润</button>

        <div class="results" id="results">
          <div class="result-item">
            <div class="result-label">获得蛋币</div>
            <div class="result-value" id="eggCoins">-</div>
          </div>
          <div class="result-item" id="couponItem">
            <div class="result-label">无门槛优惠券</div>
            <div class="result-value" id="coupons">-</div>
          </div>
          <div class="result-item" id="totalReturnItem">
            <div class="result-label">兑换后总金额（元）</div>
            <div class="result-value" id="totalReturn">-</div>
          </div>
          <div class="result-item" id="profitItem">
            <div class="result-label">赚取金额（元）</div>
            <div class="result-value" id="profit">-</div>
          </div>
          <div class="result-item" id="discountItem">
            <div class="result-label">折扣</div>
            <div class="result-value" id="discount">-</div>
          </div>
          <div class="result-item" id="actualDiscountItem">
            <div class="result-label">实际折扣</div>
            <div class="result-value" id="actualDiscount">-</div>
          </div>
        </div>
      </div>

      <div id="coupon-tab" style="display: none;">
        <h1>🎫 优惠券分析</h1>

        <div class="form-group">
          <label>选择日期类型</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="couponRebate" name="couponDayType" value="rebate" checked>
              <label for="couponRebate">返利日</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="couponNormal" name="couponDayType" value="normal">
              <label for="couponNormal">非返利日</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>优惠券类型</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="discountCoupon" name="couponType" value="discount" checked>
              <label for="discountCoupon">折扣券（如7折）</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="fixedCoupon" name="couponType" value="fixed">
              <label for="fixedCoupon">金额券（如328-100）</label>
            </div>
          </div>
        </div>
        <div class="form-group" id="discountInput">
          <label for="couponDiscount">优惠券折扣（如0.7表示7折）</label>
          <input type="number" id="couponDiscount" placeholder="例如：0.7" step="0.01">
        </div>
        <div class="form-group" id="fixedInput" style="display: none;">
          <label for="minAmount">使用门槛（元）</label>
          <input type="number" id="minAmount" placeholder="例如：328" step="0.01">
          <label for="fixedAmount">优惠金额（元）</label>
          <input type="number" id="fixedAmount" placeholder="例如：100" step="0.01">
        </div>
        <div class="form-group" id="useTypeInput">
          <label>优惠券使用次数</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="multipleUse" name="useType" value="multiple" checked>
              <label for="multipleUse">多次使用</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="singleUse" name="useType" value="single">
              <label for="singleUse">单次使用</label>
            </div>
          </div>
        </div>
        <div class="form-group" id="couponAmountInput">
          <label for="couponAmount">可抵金额（元）</label>
          <input type="number" id="couponAmount" placeholder="例如：10" step="0.01">
        </div>
        <button class="btn" onclick="analyzeCoupon()">分析最优充值方案</button>

        <div class="results" id="couponResults">
          <div class="result-item">
            <div class="result-label">获得蛋币</div>
            <div class="result-value" id="couponEggCoins">-</div>
          </div>
          <div class="result-item" id="couponCouponItem">
            <div class="result-label">无门槛优惠券</div>
            <div class="result-value" id="couponCoupons">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">兑换后总金额（元）</div>
            <div class="result-value" id="couponTotalReturn">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">赚取金额（元）</div>
            <div class="result-value" id="couponProfit">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">折扣</div>
            <div class="result-value" id="couponDiscount">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">实际折扣</div>
            <div class="result-value" id="couponActualDiscount">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rechargeTiers = [
      { amount: 30, eggCoins: 318 },
      { amount: 68, eggCoins: 725 },
      { amount: 128, eggCoins: 1368 },
      { amount: 198, eggCoins: 2118 },
      { amount: 328, eggCoins: 3548 },
      { amount: 648, eggCoins: 7068 }
    ];

    function showTab(tabName) {
      // 隐藏所有标签页
      document.getElementById('calculator-tab').style.display = 'none';
      document.getElementById('coupon-tab').style.display = 'none';

      // 移除所有侧边栏项目的活跃状态
      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
      });

      // 显示选中的标签页
      document.getElementById(tabName + '-tab').style.display = 'block';

      // 激活选中的侧边栏项目
      event.currentTarget.classList.add('active');
    }

    // 优惠券类型切换
    document.querySelectorAll('input[name="couponType"]').forEach(radio => {
      radio.addEventListener('change', function () {
        if (this.value === 'discount') {
          document.getElementById('discountInput').style.display = 'block';
          document.getElementById('fixedInput').style.display = 'none';
          document.getElementById('useTypeInput').style.display = 'block';
          document.getElementById('couponAmountInput').style.display = 'block';
        } else {
          document.getElementById('discountInput').style.display = 'none';
          document.getElementById('fixedInput').style.display = 'block';
          document.getElementById('useTypeInput').style.display = 'none';
          document.getElementById('couponAmountInput').style.display = 'none';
        }
      });
    });

    function getEggCoins(rechargeAmount) {
      for (let i = rechargeTiers.length - 1; i >= 0; i--) {
        if (rechargeAmount >= rechargeTiers[i].amount) {
          return rechargeTiers[i].eggCoins;
        }
      }
      return 0;
    }

    function getCoupons(actualPayment, isRebateDay) {
      if (!isRebateDay) return 0;

      let rate = 0;
      if (actualPayment >= 30 && actualPayment <= 127) {
        rate = 0.10;
      } else if (actualPayment >= 128 && actualPayment <= 327) {
        rate = 0.15;
      } else if (actualPayment >= 328 && actualPayment <= 647) {
        rate = 0.20;
      } else if (actualPayment >= 648) {
        rate = 0.25;
      }

      const couponValue = actualPayment * rate;
      return Math.ceil(couponValue);
    }

    let eggCoinsResult = 0;
    let couponsResult = 0;

    function calculate() {
      const rechargeAmount = parseFloat(document.getElementById('rechargeAmount').value);
      const actualPayment = parseFloat(document.getElementById('actualPayment').value);
      const dayType = document.querySelector('input[name="dayType"]:checked').value;
      const isRebateDay = dayType === 'rebate';

      if (isNaN(rechargeAmount) || isNaN(actualPayment)) {
        alert('请输入有效的充值金额和实际付款金额');
        return;
      }

      eggCoinsResult = getEggCoins(rechargeAmount);
      couponsResult = getCoupons(actualPayment, isRebateDay);

      document.getElementById('eggCoins').textContent = eggCoinsResult + ' 蛋币';
      document.getElementById('coupons').textContent = couponsResult + ' 张';

      const resultsDiv = document.getElementById('results');
      resultsDiv.classList.add('show');

      document.getElementById('couponItem').style.display = isRebateDay ? 'block' : 'none';
      document.getElementById('totalReturnItem').style.display = 'none';
      document.getElementById('profitItem').style.display = 'none';
      document.getElementById('discountItem').style.display = 'none';
      document.getElementById('actualDiscountItem').style.display = 'none';
    }

    function calculateProfit() {
      const eggRate = parseFloat(document.getElementById('eggRate').value);
      const couponRate = parseFloat(document.getElementById('couponRate').value);
      const actualPayment = parseFloat(document.getElementById('actualPayment').value);
      const dayType = document.querySelector('input[name="dayType"]:checked').value;
      const isRebateDay = dayType === 'rebate';

      if (eggCoinsResult === 0) {
        alert('请先点击"计算"按钮');
        return;
      }

      if (isNaN(eggRate) || (isRebateDay && isNaN(couponRate))) {
        alert('请输入有效的兑换比例');
        return;
      }

      let totalReturn = eggCoinsResult * eggRate;
      if (isRebateDay) {
        totalReturn += couponsResult * couponRate;
      }

      const profit = totalReturn - actualPayment;
      const newTotal = 0.1 * eggCoinsResult + couponsResult;
      const discount = newTotal > 0 ? actualPayment / newTotal : 0;

      document.getElementById('totalReturn').textContent = totalReturn.toFixed(2) + ' 元';
      const profitElement = document.getElementById('profit');
      profitElement.textContent = profit.toFixed(2) + ' 元';

      profitElement.classList.remove('profit-positive', 'profit-negative', 'profit-zero');
      if (profit > 0) {
        profitElement.classList.add('profit-positive');
      } else if (profit < 0) {
        profitElement.classList.add('profit-negative');
      } else {
        profitElement.classList.add('profit-zero');
      }

      document.getElementById('discount').textContent = discount.toFixed(4) + ' 折';

      // 显示与优惠券分析相同的折扣计算方式
      const discountRate = newTotal > 0 ? actualPayment / newTotal : 0;
      document.getElementById('actualDiscount').textContent = discountRate.toFixed(4) + ' 折';

      document.getElementById('totalReturnItem').style.display = 'block';
      document.getElementById('profitItem').style.display = 'block';
      document.getElementById('discountItem').style.display = 'block';
      document.getElementById('actualDiscountItem').style.display = 'block';
    }

    function analyzeCoupon() {
      try {
        const couponType = document.querySelector('input[name="couponType"]:checked').value;
        let useType = 'multiple';
        let couponAmount = 0;
        const dayType = document.querySelector('input[name="couponDayType"]:checked').value;
        const isRebateDay = dayType === 'rebate';

        let couponDiscount = 0;
        let fixedAmount = 0;
        let minAmount = 0;

        if (couponType === 'discount') {
          useType = document.querySelector('input[name="useType"]:checked').value;
          couponAmount = parseFloat(document.getElementById('couponAmount').value);
          couponDiscount = parseFloat(document.getElementById('couponDiscount').value);
          if (isNaN(couponDiscount)) {
            alert('请输入有效的折扣值');
            return;
          }
          if (couponDiscount >= 1) {
            alert('优惠券折扣必须小于1，例如75折应输入0.75');
            return;
          }
          if (couponDiscount <= 0) {
            alert('优惠券折扣必须大于0');
            return;
          }
          if (isNaN(couponAmount)) {
            alert('请输入有效的可抵金额');
            return;
          }
          if (couponAmount < 0) {
            alert('可抵金额必须大于等于0');
            return;
          }
        } else {
          // 金额券：优惠金额就是可抵金额，强制单次使用
          useType = 'single';
          minAmount = parseFloat(document.getElementById('minAmount').value);
          fixedAmount = parseFloat(document.getElementById('fixedAmount').value);
          couponAmount = fixedAmount; // 优惠金额就是可抵金额
          if (isNaN(minAmount)) {
            alert('请输入有效的使用门槛');
            return;
          }
          if (minAmount <= 0) {
            alert('使用门槛必须大于0');
            return;
          }
          if (isNaN(fixedAmount)) {
            alert('请输入有效的优惠金额');
            return;
          }
          if (fixedAmount <= 0) {
            alert('优惠金额必须大于0');
            return;
          }
        }

        console.log('优惠券类型:', couponType);
        console.log('使用类型:', useType);
        console.log('可抵金额:', couponAmount);
        if (couponType === 'discount') {
          console.log('优惠券折扣:', couponDiscount);
        } else {
          console.log('使用门槛:', minAmount);
          console.log('优惠金额:', fixedAmount);
        }

        // 默认兑换比例
        const defaultEggRate = 0.075;
        const defaultCouponRate = 0.75;

        // 分析所有充值档位
        let bestProfitOption = null;
        let bestDiscountOption = null;
        let maxProfit = -Infinity;
        let bestDiscount = Infinity; // 折扣越小越好

        for (const tier of rechargeTiers) {
          // 计算使用优惠券后的实际付款金额
          const originalAmount = tier.amount;
          let remainingCouponAmount = couponAmount;
          let actualDiscount = 0;
          let actualPayment = originalAmount;

          if (couponType === 'discount') {
            // 折扣券计算
            const discountAmount = originalAmount * (1 - couponDiscount);
            actualDiscount = Math.min(discountAmount, couponAmount);
            actualPayment = originalAmount - actualDiscount;
          } else {
            // 金额券计算：只有达到使用门槛才能使用
            if (originalAmount >= minAmount) {
              actualDiscount = Math.min(fixedAmount, couponAmount);
              actualPayment = originalAmount - actualDiscount;
            } else {
              // 未达到使用门槛，不使用优惠券
              actualDiscount = 0;
              actualPayment = originalAmount;
            }
          }

          if (useType === 'single') {
            // 单次使用：无论抵扣多少，优惠券都消失
            remainingCouponAmount = 0;
          } else {
            // 多次使用：剩余可抵金额
            remainingCouponAmount = couponAmount - actualDiscount;
          }

          // 计算获得的蛋币和无门槛优惠券
          const eggCoins = tier.eggCoins;
          const coupons = getCoupons(actualPayment, isRebateDay);

          // 计算总价值
          let totalValue = eggCoins * defaultEggRate;
          if (isRebateDay) {
            totalValue += coupons * defaultCouponRate;
          }

          // 计算利润
          const profit = totalValue - actualPayment;

          // 计算折扣
          const newTotal = 0.1 * eggCoins + coupons;
          const discount = newTotal > 0 ? actualPayment / newTotal : 0;
          // 计算实际折扣比例（实际付款/原价）
          const actualDiscountRate = actualPayment / originalAmount;

          // 记录利润最优方案
          if (profit > maxProfit) {
            maxProfit = profit;
            bestProfitOption = {
              tier: tier,
              actualPayment: actualPayment,
              eggCoins: eggCoins,
              coupons: coupons,
              totalValue: totalValue,
              profit: profit,
              discount: discount,
              actualDiscountRate: actualDiscountRate,
              remainingCouponAmount: remainingCouponAmount
            };
          }

          // 记录折扣最优方案
          if (discount < bestDiscount && discount > 0) {
            bestDiscount = discount;
            bestDiscountOption = {
              tier: tier,
              actualPayment: actualPayment,
              eggCoins: eggCoins,
              coupons: coupons,
              totalValue: totalValue,
              profit: profit,
              discount: discount,
              actualDiscountRate: actualDiscountRate,
              remainingCouponAmount: remainingCouponAmount
            };
          }
        }

        // 显示最优方案
        if (bestProfitOption) {
          // 显示利润最优方案
          document.getElementById('eggCoins').textContent = bestProfitOption.eggCoins + ' 蛋币';
          document.getElementById('coupons').textContent = bestProfitOption.coupons + ' 张';
          document.getElementById('totalReturn').textContent = bestProfitOption.totalValue.toFixed(2) + ' 元';

          const profitElement = document.getElementById('profit');
          profitElement.textContent = bestProfitOption.profit.toFixed(2) + ' 元';
          profitElement.classList.remove('profit-positive', 'profit-negative', 'profit-zero');
          if (bestProfitOption.profit > 0) {
            profitElement.classList.add('profit-positive');
          } else if (bestProfitOption.profit < 0) {
            profitElement.classList.add('profit-negative');
          } else {
            profitElement.classList.add('profit-zero');
          }

          document.getElementById('discount').textContent = bestProfitOption.discount.toFixed(4) + ' 折';
          document.getElementById('actualDiscount').textContent = bestProfitOption.discount.toFixed(4) + ' 折';

          // 显示结果
          const resultsDiv = document.getElementById('results');
          resultsDiv.classList.add('show');
          document.getElementById('couponItem').style.display = isRebateDay ? 'block' : 'none';
          document.getElementById('totalReturnItem').style.display = 'block';
          document.getElementById('profitItem').style.display = 'block';
          document.getElementById('discountItem').style.display = 'block';
          document.getElementById('actualDiscountItem').style.display = 'block';

          // 显示推荐信息
          let alertMessage = '💰 利润最优方案：' + bestProfitOption.tier.amount + '元\n' +
            `实际付款：${bestProfitOption.actualPayment.toFixed(2)}元\n` +
            `获得蛋币：${bestProfitOption.eggCoins}个\n` +
            `获得优惠券：${bestProfitOption.coupons}张\n` +
            `总价值：${bestProfitOption.totalValue.toFixed(2)}元\n` +
            `预估利润：${bestProfitOption.profit.toFixed(2)}元\n` +
            `实际折扣：${bestProfitOption.discount.toFixed(4)}折\n` +
            `剩余可抵金额：${bestProfitOption.remainingCouponAmount.toFixed(2)}元\n\n`;

          // 如果折扣最优方案与利润最优方案不同，也显示折扣最优方案
          if (bestDiscountOption && bestDiscountOption.tier.amount !== bestProfitOption.tier.amount) {
            alertMessage += '📉 折扣最优方案：' + bestDiscountOption.tier.amount + '元\n' +
              `实际付款：${bestDiscountOption.actualPayment.toFixed(2)}元\n` +
              `获得蛋币：${bestDiscountOption.eggCoins}个\n` +
              `获得优惠券：${bestDiscountOption.coupons}张\n` +
              `总价值：${bestDiscountOption.totalValue.toFixed(2)}元\n` +
              `预估利润：${bestDiscountOption.profit.toFixed(2)}元\n` +
              `实际折扣：${bestDiscountOption.discount.toFixed(4)}折\n` +
              `剩余可抵金额：${bestDiscountOption.remainingCouponAmount.toFixed(2)}元`;
          }

          alert(alertMessage);
        }
      } catch (error) {
        console.error('分析优惠券时出错:', error);
        alert('分析过程中出现错误，请检查控制台日志');
      }
    }
  </script>
